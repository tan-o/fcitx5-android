name: Build Mods (debug)

on:
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mods-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_ABI: ${{ matrix.abi }}
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android environment
        uses: android-actions/setup-android@v4
      - name: Install Android tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "ndk;28.0.13004108" "cmake;3.31.6"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test and build app with embedded Rime
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Collect APKs
        if: matrix.abi == 'arm64-v8a'
        # Validate embedded assets before publishing an installable artifact.
        run: |
          python3 scripts/verify-mods-apk.py
          mkdir -p apks
          cp app/build/outputs/apk/debug/*.apk apks/
          sha256sum apks/*.apk > apks/SHA256SUMS.txt
      - name: Upload APKs
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v7
        with:
          name: fcitx5-android-mods-arm64-debug
          path: apks/
          if-no-files-found: error
      - name: Enable KVM
        if: matrix.abi == 'x86_64'
        run: sudo chmod 666 /dev/kvm
      - name: Test actual dialogs, IME history and Git on Android
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.fcitx.fcitx5.android.ModsInteractionTest --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mods-test-reports-${{ matrix.abi }}
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
